[tool.poetry]
name = "views_pipeline_core"
version = "3.0.0"
description = ""
authors = [
    "Borbála Farkas <borbala.farkas@pcr.uu.se>",
    "Dylan Pinheiro <dylpin@prio.org>",
    "Xiaolong Sun <xiaolong.sun@pcr.uu.se>"
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
viewser = "^6.6.4"
pytest = "^9.0.3"
ingester3 = "=2.1.1"
wandb = "^0.18.7"
pyprojroot="^0.3.0"
views-evaluation = "^0.4.0"
views-transformation-library = "^2.7.2"
art = "^6.4"
polars = ">=1.34.0,<2.0.0"
views-frames = "^1.8"

# OPTIONAL (#345, register C-253). Appwrite is the SECONDARY EXTERNAL destination under
# ADR-047 — local disk is authoritative and views-forecasts is the primary external
# store, so a repo that never delivers to the FAO API has no reason to carry a vendor
# SDK. Measured before the change: views-hydranet, views-baseline and views-evaluation
# contained ZERO references to Appwrite and all three installed it transitively.
#
#     pip install views-pipeline-core[appwrite]
#
# Made optional while 3.0.0 was unpublished and five repos were pinned; after release it
# would have cost a major bump.
appwrite = { version = ">=13.4.1,<14.0.0", optional = true }

[tool.poetry.extras]
appwrite = ["appwrite"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning", "ignore::UserWarning"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
