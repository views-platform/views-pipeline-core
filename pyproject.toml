[tool.poetry]
name = "views_pipeline_core"
version = "3.2.0"
description = "Core orchestration, data and model-management library for the VIEWS conflict forecasting platform."
authors = [
    "Borbála Farkas <borbala.farkas@pcr.uu.se>",
    "Dylan Pinheiro <dylpin@prio.org>",
    "Xiaolong Sun <xiaolong.sun@pcr.uu.se>"
]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/views-platform/views-pipeline-core"
repository = "https://github.com/views-platform/views-pipeline-core"
documentation = "https://github.com/views-platform/views-pipeline-core/tree/main/documentation"
keywords = ["conflict-forecasting", "views", "pipeline", "machine-learning", "forecasting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
# Platform envelope (>=3.11,<3.15) — matches views-evaluation 1.0.0 and views-reporting
# 0.3.3, so this repo neither under- nor over-declares relative to the platform.
#
# TESTED ON 3.11 ONLY. Every CI workflow here and in both sibling repos hardcodes 3.11;
# there is no version matrix. On 3.12-3.14 an install RESOLVES and then fails LOUDLY at
# BUILD time, in the transitive chain rather than here:
#
#   ingester3 =2.1.1 -> levenshtein 0.20.9   cp311 is its last wheel; the sdist build fails
#   viewser           -> pandas <2.0          pandas 1.5.3 ships no wheel past cp311
#                        (our own pandas floor is 1.5.3 for the same reason)
#
# Both upstreams declare a permissive `requires_python` they do not have wheels for, which
# is why the resolver does not catch it. Narrowing our own ceiling would not fix the wall —
# it would only re-create the under-declaration views-reporting deliberately widened away
# from — and a build error is loud, not silent. The fix is upstream. See register C-112
# (the pandas <2.0 ecosystem lock across eight views-* packages, tracked as #308).
python = ">=3.11,<3.15"
# viewser is REQUIRED through 3.x and becomes the `[viewser]` extra at 4.0 (ADR-063; the
# major-gated test in tests/test_viewser_is_optional_by_the_next_major.py names the sites).
# It is the only data-source client the package needs at runtime, and it is reached
# duck-typed — no module in views_pipeline_core imports it; the MODEL's config_queryset.py
# does. It carries pandas<2, numpy<2, toolz<0.12 and (via views-storage) pyarrow<17 into
# every consumer's environment; 29 of the 106 views-models sources and all 13 ensembles
# never call it. NOT declared as an extra yet, deliberately: poetry-core marks any
# dependency named in [tool.poetry.extras] with `; extra == "..."` in the wheel even when
# it is not `optional = true` — a "declared, still required" extra would silently ship
# the 4.0 flip inside a 3.x wheel (probed 2026-09-17, poetry 2.x).
viewser = "^6.6.4"
# pandas and pyarrow were UNDECLARED until 3.3.0. Fourteen modules import pandas at module
# scope (two more only under TYPE_CHECKING) and three import pyarrow at module scope (managers/prediction/{savers,io,
# prediction_frame_converter}.py). Measured in a fresh venv with viewser's chain removed
# (2026-09-17): pyarrow arrives ONLY through viewser -> views-storage, so a viewser-free
# install of 3.2.0 fails at IMPORT, not at fetch; pandas also arrives through ingester3,
# but with a floor only (>1.2.3), so the same install would have resolved an untested
# pandas 3. Register C-295 (#478) lists the undeclared set; these two are the ones viewser
# was hiding. The ranges intersect viewser's own caps today, so the resolved versions do
# not move: pandas <3 because pandas-1 pickles in model caches (files/utils.py
# read_pickle) are untested against pandas 3 and the 2026-05-27 "1385/1386 tests on pandas
# 3.0.3" evidence predates half the current suite; pyarrow <17 because that is what
# views-storage 1.1.7 resolves to and nothing here is tested beyond it — and now that the
# ceiling is declared HERE, lifting it is a two-step: #280 (upstream) AND this line, with
# the ADR-013 fixture re-baseline #280 owns. Widening either is non-breaking and is the
# 4.0 train's job, with a pandas-3 matrix behind it.
pandas = ">=1.5.3,<3.0"
pyarrow = ">=14.0.0,<17.0.0"
# tqdm: imported at module scope by all three ensemble managers; on this platform it
# arrived only through viewser (`pip show tqdm` -> Required-by: viewser, plus engine-side
# torch stacks that the core does not declare). Found by resolving the manifest WITHOUT
# viewser and importing every module — `managers.ensemble` was the one that failed.
tqdm = ">=4.66,<5.0"
ingester3 = "=2.1.1"
# wandb: the caret (`^0.18.7` = `<0.19`) stood from 2.3.0 to 3.2.0 and excluded every
# views-r2darts2 0.2.x (`wandb>=0.28.2`) — no environment could hold both (#508, #519).
# Widened 2026-09-18 after MEASURING, not reading: the full suite and an offline end-to-end
# WandBModule run (init, define_metric, scalars, tables, save, image, summary._as_dict,
# alert, artifact, finish) pass on 0.18.7 (the conda dev env) and on 0.30.0 (fresh venv). The
# `get_latest_run` project-not-found text (C-179) is unchanged between the two (read from
# the SDK source, not a live call). A sweep cannot run offline, so that path is covered only
# by the guard: tests/test_wandb_names_exist_on_the_installed_wandb.py derives from the
# source every `wandb.*` name the package evaluates and every call on one, resolves the
# names on the installed wandb and binds the calls against its signatures — the next wandb
# that moves a name or drops a keyword fails there, by call site, not in a model run
# (ADR-067). `<1.0` is the next major, the conventional place to stop. The only other
# views-* caps are views-impact's
# own `<0.19` (on pipeline-core 2.x, so it never shares an env with this range) and
# views-faoapi's `==0.18.7` (does not depend on us); r2darts2 floors at 0.28.2.
wandb = ">=0.18.7,<1.0"
pyprojroot="^0.3.0"
# views-evaluation 1.0.0 is an API-STABILITY declaration, not a rewrite: the diff from
# v0.5.0 touches zero lines under `views_evaluation/` — only tests, CI, ADR-022 and the
# version. So `^1.0.0` (= >=1.0.0,<2.0.0) buys the guarantee without changing behaviour;
# the full suite was run against 1.0.0 before this floor was raised (1707 passed).
#
# The previous `^0.5.0` capped at <0.6.0 — Poetry's caret bounds a 0.x at the next MINOR
# — so 1.0.0 was already excluded, and the suite had drifted to a version the metadata
# forbade. tests/test_declared_dependencies_match_reality.py now fails on that drift.
views-evaluation = "^1.0.0"
art = "^6.4"
polars = ">=1.34.0,<2.0.0"
views-frames = "^1.10.2"

# OPTIONAL (#345, register C-253). Appwrite is the SECONDARY EXTERNAL destination under
# ADR-047 — local disk is authoritative and views-forecasts is the primary external
# store, so a repo that never delivers to the FAO API has no reason to carry a vendor
# SDK. Measured before the change: views-hydranet, views-baseline and views-evaluation
# contained ZERO references to Appwrite and all three installed it transitively.
#
#     pip install views-pipeline-core[appwrite]
#
# Made optional while 3.0.0 was unpublished and five repos were pinned; after release it
# would have cost a major bump.
appwrite = { version = ">=13.4.1,<14.0.0", optional = true }

[tool.poetry.extras]
appwrite = ["appwrite"]

# `pytest` sat in the RUNTIME dependencies until 3.0.0, so every consumer of the platform's
# most-depended-upon package installed a test framework it never imports — five repos
# directly and ~45 downstream. It is a build/test tool, not a runtime one, and this is the
# release where moving it costs nothing. `poetry install` includes dev groups by default,
# so both CI workflows keep working unchanged (verified, not assumed).
[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[tool.pytest.ini_options]
# `ignore::UserWarning` was removed for #366. views-datafactory signals a zero-filled
# coverage gap with a `UserWarning` (their ADR-047), and that is the only thing telling a
# consumer a zero was manufactured rather than observed. Suppressing the category here
# meant no test in this repo could ever assert on it.
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
