name: Publish Package

on:
  release:
    types:
        - published
  workflow_dispatch: # enables manual triggering

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11" 

    - name: Install Poetry
      run: |
          curl -sSL https://install.python-poetry.org | python3 -

    - name: Install Dependencies
      run: |
          python -m pip install --upgrade pip
          python -m pip install toml requests packaging

    - name: Validate Version
      run: |
        latest_version=$(curl -s https://pypi.org/pypi/views-pipeline-core/json | jq -r .info.version)
        new_version=$(python -c "import toml; print(toml.load('pyproject.toml')['tool']['poetry']['version'])")
        python -c "from packaging.version import parse; assert parse('$new_version') > parse('$latest_version'), 'Version must be higher than $latest_version'"
  
    - name: Publish to PyPI
      # --skip-existing: PyPI dropped the connection mid-upload on 3.3.2
      # ("Error connecting to repository" after both artefacts reached 100%). The sdist
      # had committed; the wheel had not, leaving a source-only release. Without this
      # flag a re-run dies on "file already exists" for the sdist before it ever reaches
      # the wheel — and a PyPI filename can never be reused, so the only other recovery
      # is to burn a version number. With it, a re-run uploads exactly what is missing.
      run: poetry publish --build --skip-existing --username __token__ --password ${{ secrets.PYPI_TOKEN }}
